<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MDRS expanded offline imagery</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/vendor/maplibre-gl.css">
<style>body{margin:0;font:14px system-ui}#map{height:100vh}#info{position:absolute;top:12px;left:12px;max-width:400px;background:#fff;padding:12px;border-radius:6px;z-index:2}#status{display:block;margin-top:6px}</style>
</head><body><div id="map"></div><div id="info"><strong>MDRS · NAIP 2024 · offline</strong><br>Blue outline: expanded 4 × 5.5 km terrain footprint.<br>60 cm source imagery · pixel-preserving display.<br>Tiles 14–18; higher zoom enlarges existing detail.<span id="status">Loading local tiles…</span></div>
<script src="/vendor/maplibre-gl.js"></script><script>
Promise.all([fetch('/tiles/naip/tilejson.json').then(r=>r.json()),fetch('/crop-outline.geojson').then(r=>r.json())]).then(([t,outline])=>{
const map=new maplibregl.Map({container:'map',maxZoom:DISPLAY_MAXZOOM,style:{version:8,sources:{naip:{type:'raster',tiles:t.tiles,tileSize:256,scheme:'xyz',minzoom:t.minzoom,maxzoom:t.maxzoom,bounds:t.bounds,attribution:t.attribution}},layers:[{id:'naip',type:'raster',source:'naip',paint:{'raster-opacity':1,'raster-resampling':'nearest','raster-fade-duration':0}}]}});
window.offlineMap=map;
map.addControl(new maplibregl.NavigationControl());map.fitBounds([[t.bounds[0],t.bounds[1]],[t.bounds[2],t.bounds[3]]],{padding:35,duration:0});
map.on('load',()=>{map.addSource('crop',{type:'geojson',data:outline});map.addLayer({id:'crop',type:'line',source:'crop',paint:{'line-color':'#208bff','line-width':2}});document.querySelector('#status').textContent='Local map loaded. Click to inspect longitude / latitude.';window.map=map;});
map.on('click',e=>{document.querySelector('#status').textContent=`${e.lngLat.lng.toFixed(7)}, ${e.lngLat.lat.toFixed(7)} · zoom ${map.getZoom().toFixed(2)}`});
map.on('error',e=>{document.querySelector('#status').textContent=e.error.message});
}).catch(e=>document.querySelector('#status').textContent=e.message);
</script></body></html>
